<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada — Porto 3D</title>
    <meta name="theme-color" content="#0f2a57" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #1b3d7a, #0f2a57 70%); color: #f4ecdc; font: 17px/1.55 Georgia, 'Times New Roman', serif; text-align: center; }
      main { max-width: 520px; padding: 32px 24px; }
      .tile { width: 72px; height: 72px; margin: 0 auto 20px; display: grid; place-items: center; border: 2px solid #e0a948; border-radius: 10px; background: #fff; color: #0f2a57; font: 700 38px/1 Georgia, serif; }
      h1 { margin: 0 0 6px; font-size: 56px; font-weight: 600; color: #e0a948; letter-spacing: 0.02em; }
      p { margin: 0 0 10px; }
      .alt { color: #c9bba5; font-size: 15px; }
      a.home { display: inline-block; margin-top: 18px; padding: 12px 26px; border-radius: 999px; background: #e0a948; color: #0f2a57; font: 600 16px/1 system-ui, sans-serif; text-decoration: none; }
      a.home:hover, a.home:focus-visible { background: #f1c36a; outline: 2px solid #f4ecdc; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="tile" aria-hidden="true">P</div>
      <h1>404</h1>
      <p lang="pt-PT">Esta rua não existe no mapa do Porto.</p>
      <p class="alt" lang="en">This street is not on the map of Porto.</p>
      <p class="alt" lang="ru">Этой улицы нет на карте Порту.</p>
      <a class="home" href="/">Voltar ao mapa 3D · Back to the 3D map</a>
    </main>
  </body>
</html>
