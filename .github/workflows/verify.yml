name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Browser for the console smoke
        run: |
          npm i --no-save playwright-core
          npx playwright-core install --with-deps chromium-headless-shell
      - run: npm run verify
        env:
          PLAYWRIGHT_CORE: ${{ github.workspace }}/node_modules/playwright-core/index.mjs
